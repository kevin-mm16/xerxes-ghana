name: xerxes-ghana-dev

x-api-environment: &api-environment
  APP_ENV: development
  POSTGRES_HOST: db
  POSTGRES_DB: xerxes
  POSTGRES_USER: xerxes
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: xerxes
      POSTGRES_USER: xerxes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Create .env from .env.example}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:55433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U xerxes -d xerxes"]
      interval: 5s
      timeout: 5s
      retries: 12

  initialize:
    build: ./apps/api
    environment: *api-environment
    command: ["sh", "-c", "alembic upgrade head && python -m xerxes_api.seed --demo"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build: ./apps/api
    environment: *api-environment
    depends_on:
      initialize:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12

  web:
    build: ./apps/web
    depends_on:
      api:
        condition: service_healthy
    environment:
      API_INTERNAL_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  pg_data:
