name: CI

on:
  pull_request:
  push:
    branches: [main, develop, 'feature/**']

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: xerxes
          POSTGRES_PASSWORD: ci-only-test-password
          POSTGRES_DB: xerxes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U xerxes -d xerxes_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql+psycopg://xerxes:ci-only-test-password@127.0.0.1:5432/xerxes_test
      TEST_DATABASE_URL: postgresql+psycopg://xerxes:ci-only-test-password@127.0.0.1:5432/xerxes_test
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check src tests migrations
      - run: pytest -q

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run test
      - run: npm run typecheck
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
